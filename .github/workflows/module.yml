name: Modül sürümü

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Modül etiketi (ör. mod-chat-1.1)"
        required: true

permissions:
  contents: read

jobs:
  module:
    if: ${{ startsWith(github.event.release.tag_name || inputs.tag, 'mod-') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Etiketi çöz
        run: |
          if ! [[ "$TAG" =~ ^mod-([a-z][a-z0-9-]*)-([0-9]+(\.[0-9]+){1,3})$ ]]; then echo "Etiket mod-<modül>-<sürüm> olmalı: $TAG"; exit 1; fi
          echo "MODULE=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "VERSION=${BASH_REMATCH[2]}" >> "$GITHUB_ENV"

      - run: npm ci --ignore-scripts

      - name: Modülü derle ve imzala
        env:
          MODULE_SIGNING_KEY: ${{ secrets.MODULE_SIGNING_KEY }}
        run: |
          NOTES=$(gh release view "$TAG" --json body -q .body 2>/dev/null | head -c 280 || true)
          node scripts/build-module.mjs "$MODULE" "$VERSION" "$NOTES"

      - name: Sorvia sunucusuna yayınla
        env:
          SECRET: ${{ secrets.SORVIA_RELEASE_SECRET }}
        run: |
          set -euo pipefail
          DIR="release/modules/$MODULE/$VERSION"
          for FILE in bundle.js bundle.css; do
            curl --fail-with-body -sS --retry 3 -X PUT -H "Authorization: Bearer $SECRET" -H "Content-Type: application/octet-stream" --data-binary "@$DIR/$FILE" "https://sorvia.net/api/desktop/modules/release/$MODULE/$VERSION/$FILE"
            echo
          done
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $SECRET" -H "Content-Type: application/json" --data "@$DIR/manifest.json" https://sorvia.net/api/desktop/modules/release
